<!DOCTYPE html>
<html>
<head>
<title>Number programms</title>
<style>
body{
text-align:center;
font-family: Arial;
background-color:lightblue;
}

h1{
color:darkblue;
}

input{
padding:8px;
font-size:16px;
}

button{
padding:10px 15px;
margin:5px;
background-color:blue;
color:white;
border:none;
border-radius:5px;
}

button:hover{
background-color:darkblue;
}

#result{
margin-top:20px;
font-size:20px;
color:green;
}

</style>

</head>

<body>

<h1>Analysing your number</h1>

<input type="number" id="num" placeholder="Enter a number">

<br><br>

<button onclick="even()">Even</button>
<button onclick="odd()">Odd</button>
<button onclick="prime()">Prime</button>
<button onclick="factorial()">Factorial</button>
<button onclick="armstrong()">Armstrong</button>

<p id="result"></p>

<script>

function even(){

let k=document.getElementById("num").value;

if(k%2==0){
document.getElementById("result").innerHTML="It is an even number";
}
else{
document.getElementById("result").innerHTML="It is an odd number";
}

}

function odd(){

let k=document.getElementById("num").value;

if(k%2!=0){
document.getElementById("result").innerHTML="It is an odd number";
}
else{
document.getElementById("result").innerHTML="It is an even number";
}

}

function prime(){

let N=document.getElementById("num").value;
let Prime=true;

if(N<=1){
Prime=false;
}

for(let i=2;i<N;i++){
if(N%i==0){
Prime=false;
break;
}
}

if(Prime){
document.getElementById("result").innerHTML=N+" is a Prime number";
}
else{
document.getElementById("result").innerHTML=N+" is NOT a Prime number";
}

}

function factorial(){

let N=document.getElementById("num").value;
let fact=1;

if(N==0){
document.getElementById("result").innerHTML="Factorial is 1";
}

else if(N>0){

for(let i=1;i<=N;i++){
fact=fact*i;
}

document.getElementById("result").innerHTML="Factorial of "+N+" is "+fact;
}

else{
document.getElementById("result").innerHTML="Factorial doesn't exist for negative numbers";
}

}

function armstrong(){

let num=document.getElementById("num").value;
let temp=num;
let sum=0;
let digits=num.toString().length;

while(temp>0){

let digit=temp%10;
sum=sum+digit**digits;
temp=Math.floor(temp/10);

}

if(sum==num){
document.getElementById("result").innerHTML="This is an Armstrong number";
}
else{
document.getElementById("result").innerHTML="This is not an Armstrong number";
}

}

</script>

</body>
</html>
