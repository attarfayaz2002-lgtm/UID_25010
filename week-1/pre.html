<!DOCTYPE html>
<html>
    <head>
        <title>paragraph using pre</title>
    </head>           
    <body>
        <p>
    My Bonnie lives over the ocean.

    My Bonnie lies over the sea.

    My Bonnie lies over the ocean.

    Oh, bring my bag Bonnie to me
        </p>

    <pre>
    My Bonnie lives over the ocean

    My Bonnie lies over the sea

    My Bonnie lies over the ocean

    Oh, bring my bag Bonnie to me
    </pre>
    </body>
</html>
