<!DOCTYPE html>
<html>
    <head>
      <title>Card layout</title>
      <style>
        body
        {
        background-color: aquamarine;
        font-family:Georgia, 'Times New Roman', Times, serif
        }
        .container{ 
                display: flex;
                flex-wrap: wrap;
                flex-direction: row;
                background-color:yellow;
                border: 2px 2px 2px solid black;
                box-shadow: 5px black;
                justify-content: center;
                padding: 20px;
                text-align: center;
            }
            .card {
                background-color:whitesmoke;
                border: 1px solid black;
                box-shadow: 3px 3px 6px rgb(23, 20, 2);
                margin: 10px auto;
                padding: 15px;
                width: 250px;
            }
            .card img{
                width: 70%;
                height: 60%;
            }
            .card button{
                background-color: greenyellow;
                color:rgb(36, 5, 5);
                text-align: center;
            }
            .card button:hover{
                background-color:greenyellow;
                color:blue;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h2 align="center">Natural Resources</h2> 
        <div class="container">
            <div class="card">
                <img src="water.JPEG" alt="Image">
                <h3>Water</h3>
                <p>Water is the primary resource for living beings.</p>
                <button>Additional info</button>
            </div>
            <div class="card">
                <img src="land.JPEG" alt="Image">
                <h3>Land</h3>
                <p>Land is a precious resource for the survival of all creatures</p>
                <button>Additional info</button>
            </div>
            <div class="card">
                <img src="sky.JPEG" alt="Image">
                <h3>Sky</h3>
                <p>sky is a fruitfull resource for providing rains,etc</p>
                <button>Additional info</button>
            </div>
        </div>
    </body>
</html>
