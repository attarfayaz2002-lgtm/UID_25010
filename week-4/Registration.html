<!DOCTYPE html>
<html>
    <head>
        <title>lab exercise</title>
    </head>
    <body>
       
 <h1 style="text-align:center;">College Admission Registration</h1>
 <form>
       <table cellspacing="0" cellpadding="15" border="3" style="text-align: left;border: 3px black solid;margin:auto">
            <tr>
               <th><label for="fname">Full Name:</label></th>
                <td><input type="text" name="fname" id="fname"></td>
            </tr>
<tr>
    <th><label for="Email">Email:</label></th>
    <td><input type="email" id="Email" name="Email"><br></td>
</tr>
<tr>
    <th><label for="Phone Number">Phone Number:</label></th>
    <td><input type="number" id="Phone Number" name="Phone Number"><br></td>
</tr>
<tr> 
    <th><label for="Gender">Gender:</label></th>
    <td><input type="radio" id="Gender" value="Male">Male
    <input type="radio" id="Gender" value="Female">Female
    <input type="radio" id="Gender" value="other">Other</td>
</tr>
<tr>
    <th><label for="Course">Course Applying For:</label></th>
    <td><select id="Course" name="Course">
        <option value="B.Tech">B.Tech</option>
        <option value="Ph.D">Ph.D</option></select>
    </td>
</tr>
<tr>
    <th><label for="Hobbies">Hobbies:</th>
    <td><input type="checkbox" id="Hobbies" value="Sports">Sports
    <input type="checkbox" id="Hobbies" value="Music">Music
    <input type="checkbox" id="Hobbies" value="Reading">Reading</td>
</tr>
<tr>
    <th><label for="DOB">Date Of Birth:</label></th>
    <td><input type="date" id="DOB" name="DOB"></td>
</tr>
<tr>
    <th><label for="abc">Upload Certificates:</label></th>
    <td><input type="file" id="abc" name="abc"></td>
</tr>
<tr>
    <th><label for="add">Address:</label></th>
    <td><textarea name="message" rows="5" cols="50"></textarea></td>
</tr>
<tr>
    <td colspan="5" align="center">
    <button type="Submit">Submit</button>
    <button type="reset">Reset</button></td>
</tr>
</body>
<table>
</form>

</html>
