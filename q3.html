<!DOCTYPE html>

<html>
<head>
<title>Password Strength</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #00b09b, #96c93d);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    width: 320px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

input {
    width: 80%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

#msg {
    margin-top: 10px;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="container">
    <h2>Password Strength</h2>

<p>
    At least 6 characters <br>
    One uppercase letter <br>
    One special symbol
</p>

<input type="password" id="pass" placeholder="Enter password" onkeyup="checkStrength()">
<p id="msg"></p>

</div>

<script>
function checkStrength() {

    let a = document.getElementById("pass").value;
    let msg = document.getElementById("msg");

    if (a === "") {
        msg.innerText = "Enter password";
        msg.style.color = "red";
        return;
    }

    let strong = /^(?=.*[A-Z])(?=.*[!@#$%^&*]).{6,}$/;
    let medium = /^(?=.*[A-Z]).{6,}$/;

    if (strong.test(a)) {
        msg.innerText = "Strong Password";
        msg.style.color = "green";
    } 
    else if (medium.test(a)) {
        msg.innerText = "Medium Password";
        msg.style.color = "orange";
    } 
    else {
        msg.innerText = "Weak Password";
        msg.style.color = "red";
    }
}
</script>

</body>
</html>
