<!DOCTYPE html>
<html>
    <head>
        <title>Unordered list and ordered list</title>
    </head>
    <body>
        <h1>Vegetables</h1>
        <ul>
            <li>tomatoes</li>
            <li>bringal</li>
            <li>carrot</li>
            <li>Mirchi</li>
        </ul>
        <h1>Fruits</h1>
        <ol>
            <li>Apple</li>
            <li>Banana</li>
            <li>cherry</li>
            <li>Grapes</li>
        </ol>
    </body>
</html>
